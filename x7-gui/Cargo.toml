[package]
name = "x7-gui"
version = "0.2.0"
edition = "2024"
description = "Tray icon and control window for the Sound Blaster X7"
license = "MIT"

[dependencies]
x7 = { path = "../x7" }
eframe = "0.36"
ksni = { version = "0.3", features = ["blocking"] }
zbus = "5"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
